# Builds the STODD Core jar on every push (and by hand: Actions > Build STODD Core > Run workflow).
# The finished jar is attached to the run as the artifact "stodd_core"; pushing a tag v<version> also makes a release with it.
name: Build STODD Core
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generated files are up to date (config schema from 00_config.js, sky-island world files)
        run: |
          node tools/gen_config.js
          python3 tools/gen_sky_world.py
          git diff --exit-code -- src/main/resources || (echo "run node tools/gen_config.js and python3 tools/gen_sky_world.py, then commit" && exit 1)
      - name: Script tests (KubeJS scripts against a mock world)
        run: |
          node tools/lint.js src/main/resources/embedded/kubejs/server_scripts/stodd src/main/resources/embedded/kubejs/startup_scripts/stodd_startup.js
          node tools/runall.js src/main/resources/embedded/kubejs/server_scripts/stodd
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the mod (ForgeGradle downloads Minecraft and Forge 1.20.1 the first time)
        run: ./gradlew build stoddTests --stacktrace
      - name: Collect the jar
        run: |
          mkdir dist
          ver=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          # Renamer writes the game-ready (SRG) jar as ...-renamed.jar; that is the one for mods/
          jar=$(find build -name 'stodd_core-*-renamed.jar' | head -n 1)
          cp "$jar" "dist/stodd_core-$ver.jar"
          ls -l dist
          test -n "$(ls dist)"
      - uses: actions/upload-artifact@v4
        with:
          name: stodd_core
          path: dist/*.jar
      - name: Keep the jar on the dist branch (a direct download link, also for tools that cannot reach artifact storage)
        if: github.ref == 'refs/heads/main'
        run: |
          cd dist
          git init -q
          git checkout -q -b dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add *.jar
          git commit -q -m "stodd_core jar built from ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dist
      - name: Release on a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
