# ===========================================================================================================
#  STODD island layout: how big the islands are and how far apart they sit
# ===========================================================================================================
#
#  HOW TO USE
#    1. Change the word after "preset =" below (or use the fine-control lines further down).
#    2. Save this file and restart the server (or the game).
#    3. Make a NEW world.  Chunks that were already generated keep the old islands, so changing the spacing in an
#       old world only changes the parts you have not visited yet and leaves ugly seams.
#
#  STODD Core copies these values into config/survivalisland.json every time it starts, so you never need to edit
#  that file (any edit made there is overwritten).  Check what is active in game with:  /stodd world
#
#  Lines starting with # are comments.  Write each setting on its own line as  name = value  (a dot, not a comma, for decimals).
#
#  PRESETS   (numbers are from a simulation of the generator; real islands wobble a little around them)
#
#    preset     size   separation   island across   sea between coasts     islands per 100 km2
#                                    (typical)      (typical, closest..farthest)
#    packed      110         520            290     350  (230 .. 740)                 122
#    snug        140         560            370     320  (190 .. 740)                 106
#    default     140         680            370     480  (310 .. 960)                  74
#    wide        140         900            370     730  (530 .. 1260)                  43
#    remote      140        1200            380    1050  (830 .. 1570)                  25
#    lonely      140        1700            380    1770  (1430 .. 2320)                  12
#    large       200         800            530     470  (270 .. 1040)                  53
#    grand       300        1300            790     770  (510 .. 1510)                  21
#
#    packed  = small islands close together: a short boat or elytra hop between neighbours
#    snug    = normal-sized islands, a bit closer than the default
#    default = what STODD shipped with up to now (your current worlds use this)
#    wide    = a long sail between islands
#    remote  = a very long sail; the sea is mostly empty
#    lonely  = almost no neighbours in sight
#    large   = bigger islands, medium gaps (more room for towns and the city)
#    grand   = very big islands (about 800 blocks across), far apart
#
preset = default

# ---------------------------------------------------------------------------------------------------------
#  FINE CONTROL  (optional: remove the # at the start of a line to use it; these beat the preset)
# ---------------------------------------------------------------------------------------------------------
#
#  islandSize        Radius in blocks of an island's core.  The island itself is about 2.6x this across
#                    (140 gives islands about 370 blocks across).  Allowed 40 to 800.
#  islandSeparation  Smallest allowed distance in blocks between two island CENTRES.  More separation = more sea
#                    between islands and fewer islands.  Allowed 160 to 6000.
#                    Rule of thumb: keep it at least 4 x islandSize so the islands stay separate (the simulation shows
#                    coasts nearly touching at 3.2 x).  Below 2.5 x the mod raises it for you and says so in the log.
#
# islandSize = 140
# islandSeparation = 680
#
#  Cities, sky islands and themed islands adapt to whatever land they are given: a small island simply gets a
#  smaller city.  For the full-size city keep islandSize at 140 or more.
#
# ---------------------------------------------------------------------------------------------------------
#  ADVANCED  (you almost never need these)
# ---------------------------------------------------------------------------------------------------------
#
#  underwaterFalloff   How far the sea floor slopes down around an island, as a multiple of islandSize (1 to 30).
#                      9 = a gentle slope.  Lower = steeper drop-off.
#  coastA.min / coastA.max, coastB.min / coastB.max
#                      The two continentalness ranges the generator blends between.  min must be below 0 and max above
#                      0.  Raising the max makes the land higher and a little wider; lowering the min makes the
#                      surrounding sea deeper.  Defaults: A -0.5 .. 0.9, B -1.0 .. 1.4
#
# underwaterFalloff = 9
# coastA.min = -0.5
# coastA.max = 0.9
# coastB.min = -1.0
# coastB.max = 1.4
